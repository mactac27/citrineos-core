# Specula login theme — matches the operator-ui nebula login page.
#
# `parent=base` is Keycloak's minimal scaffold — provides Freemarker
# templates for flows we don't override (TOTP, WebAuthn, password
# reset, etc.) with zero styling baggage. `parent=keycloak` would
# pull in Patternfly (1.5MB CSS), Red Hat fonts, Font Awesome, and
# a default background image — all of which we replace anyway,
# so loading them wastes ~2MB per login page hit.

parent=base

styles=css/login.css

# Explicitly clear the parent's stylesheet chain so nothing else gets
# rendered into the <link> soup.
stylesCommon=